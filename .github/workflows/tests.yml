name: Code Quallity and Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ObjectStorage__Endpoint: http://localhost:8333
      ObjectStorage__Region: us-east-1
      ObjectStorage__BucketName: pitaka-test
      ObjectStorage__AccessKeyId: test-only-object-storage-key
      ObjectStorage__SecretAccessKey: test-only-object-storage-secret

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build --no-restore
      - name: Start SeaweedFS
        run: |
          docker run --detach --name seaweedfs --publish 8333:8333 \
            --env AWS_ACCESS_KEY_ID=test-only-object-storage-key \
            --env AWS_SECRET_ACCESS_KEY=test-only-object-storage-secret \
            --env S3_BUCKET=pitaka-test \
            chrislusf/seaweedfs:4.47 mini -dir=/data

          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8333/ || true)
            if [ "$status" = "403" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs seaweedfs
          exit 1

      - run: dotnet test --no-build

  publish:
    name: Publish API and migration images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-fixed-image-publication-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify the fixed image pair
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/publish-images.sh

  advance-main-tags:
    name: Advance moving main image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-main-image-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify and advance the main tags
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/update-main-image-tags.sh
