name: Build and Deploy

on:
  pull_request:
  workflow_run:
    workflows: ["Code Quality and Tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  image-publication-contract:
    name: Image publication contract
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

      - name: Test image publication contract
        run: ./scripts/tests/image-publication-test.sh

  publish:
    name: Publish API image
    needs: image-publication-contract
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-fixed-image-publication-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify the fixed API image
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PITAKA_EVIDENCE_PATH: ${{ runner.temp }}/api-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: ./scripts/publish-images.sh

      - name: Upload API smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  advance-main-tags:
    name: Advance the moving API image tag
    needs: publish
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pitaka-main-image-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify and advance the main tags
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: ./scripts/update-main-image-tags.sh
