name: Select local API image

on:
  workflow_run:
    workflows: [Build and Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger_run_id:
        description: Successful Build and Deploy run ID to reconcile
        required: true
        type: string
      trigger_run_attempt:
        description: Successful Build and Deploy run attempt to reconcile
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  select:
    name: Select verified current-main API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted source workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: docker/setup-buildx-action@v3

      - name: Verify promoter and current-main image evidence
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PITAKA_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.trigger_run_id }}
          PITAKA_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.event.inputs.trigger_run_attempt }}
          PITAKA_HANDOFF_STATE: ${{ runner.temp }}/pitaka-api-selection-state.json
        run: node scripts/select-local-api-image.mjs verify

      - name: Create deploy-repository-scoped App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: itsdevjimbo
          repositories: pitaka-deploy
          permission-contents: write

      - name: Check out deploy record and canonical validator
        id: deploy_checkout
        uses: actions/checkout@v4
        with:
          repository: itsdevjimbo/pitaka-deploy
          ref: main
          path: pitaka-deploy
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Select or reconcile the verified API image
        id: apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_APP_TOKEN: ${{ steps.app_token.outputs.token }}
          DEPLOY_APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          PITAKA_DEPLOY_CHECKOUT: ${{ github.workspace }}/pitaka-deploy
          PITAKA_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.trigger_run_id }}
          PITAKA_TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.event.inputs.trigger_run_attempt }}
          PITAKA_HANDOFF_STATE: ${{ runner.temp }}/pitaka-api-selection-state.json
        run: node scripts/select-local-api-image.mjs apply

      - name: Write handoff summary
        if: always()
        env:
          PITAKA_HANDOFF_STATE: ${{ runner.temp }}/pitaka-api-selection-state.json
          PITAKA_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PITAKA_APP_TOKEN_OUTCOME: ${{ steps.app_token.outcome }}
          PITAKA_DEPLOY_CHECKOUT_OUTCOME: ${{ steps.deploy_checkout.outcome }}
          PITAKA_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: node scripts/select-local-api-image.mjs report
